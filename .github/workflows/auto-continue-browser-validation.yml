name: Auto-continue browser validation

on:
  push:
    branches:
      - work/97-self-healing-continuation

permissions:
  contents: write

jobs:
  chromium-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/97-self-healing-continuation
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Focused reconciliation regressions
        run: npx vitest run tests/run-controller.test.ts tests/state-machine.test.ts tests/stream-watch.test.ts tests/transcript.test.ts
      - name: Real Chromium missed-event recovery
        run: xvfb-run -a node scripts/auto-continue-browser-validation.mjs
      - name: Remove temporary validation files
        if: always()
        run: |
          rm -f .github/workflows/auto-continue-browser-validation.yml
          rm -f scripts/auto-continue-browser-validation.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "test: remove temporary auto-continue browser validation"
            git push origin HEAD:work/97-self-healing-continuation
          fi
