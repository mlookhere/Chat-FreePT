name: Browser validation

on:
  push:
    branches:
      - work/72-browser-validation-actions

permissions:
  contents: read

jobs:
  chromium-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Deterministic sleep/wake regression tests
        run: npx vitest run tests/stream-watch.test.ts tests/run-controller.test.ts tests/panel.test.ts tests/developer-mode-activation.test.ts
      - name: Real Chromium MV3 smoke
        run: xvfb-run -a node scripts/browser-validation.mjs
