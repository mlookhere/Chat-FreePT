name: Temporary diagnostics formatter

on:
  push:
    branches:
      - work/110-state-diagnostics-recorder

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/110-state-diagnostics-recorder
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/build.mjs src tests
          git commit -m "chore: apply diagnostics formatting"
          git push origin HEAD:work/110-state-diagnostics-recorder
