name: One-shot format PR 98

on:
  push:
    branches:
      - work/97-self-healing-continuation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/97-self-healing-continuation
          fetch-depth: 0
      - name: Install exact project toolchain
        run: npm ci --no-audit --no-fund
      - name: Format repository TypeScript
        run: npm run format
      - name: Commit formatting and remove this one-shot workflow
        run: |
          rm .github/workflows/format-pr98.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 1
          fi
          git commit -m "style: apply repository formatter"
          git push origin HEAD:work/97-self-healing-continuation
