name: Prettier continuation diagnostic

on:
  pull_request:
    branches: [work/40-continuation-controls]

permissions:
  contents: read

jobs:
  format:
    name: Capture formatted continuation files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Node toolchain
        run: npm ci --no-audit --no-fund
      - name: Format continuation files with repository Prettier
        run: npx prettier --write src/common/state-machine.ts src/content/ui/panel.ts tests/continuation-controls.test.ts
      - name: Upload exact formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prettier-continuation-${{ github.run_id }}
          path: |
            src/common/state-machine.ts
            src/content/ui/panel.ts
            tests/continuation-controls.test.ts
          if-no-files-found: error
          retention-days: 1
