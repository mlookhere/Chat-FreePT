name: Prettier diagnostic

on:
  push:
    branches:
      - work/69-github-bridge-protocol

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/content/developer-mode-activation.ts
      - name: Print exact formatted source
        run: |
          echo '---CHAT_FREEPT_FORMATTED_SOURCE---'
          cat src/content/developer-mode-activation.ts
          echo '---END_CHAT_FREEPT_FORMATTED_SOURCE---'
