name: Temporary format PR 124

on:
  push:
    branches:
      - work/121-network-lifecycle

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/121-network-lifecycle
          persist-credentials: true

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Format changed TypeScript
        run: npx prettier --write src/common/state-machine.ts src/content/run-controller.ts src/page/chat-state-bridge.ts tests/run-controller.test.ts

      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-format-pr124.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/common/state-machine.ts src/content/run-controller.ts src/page/chat-state-bridge.ts tests/run-controller.test.ts .github/workflows/tmp-format-pr124.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: format network lifecycle changes"
          git push origin HEAD:work/121-network-lifecycle
