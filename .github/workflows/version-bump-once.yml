name: One-shot version bump

on:
  push:
    branches:
      - work/73-version-0.2.0

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Generate npm and manifest version metadata
        run: |
          npm version 0.2.0 --no-git-tag-version
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "src/manifest.json";
          const manifest = JSON.parse(readFileSync(path, "utf8"));
          manifest.version = "0.2.0";
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Commit generated metadata and remove this workflow
        run: |
          rm .github/workflows/version-bump-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/manifest.json .github/workflows/version-bump-once.yml
          git diff --cached --check
          git commit -m "chore: bump version to 0.2.0"
          git push origin HEAD:work/73-version-0.2.0
