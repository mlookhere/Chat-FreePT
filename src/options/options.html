<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chat FreePT settings</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 16px;
        background: #202123;
        color: #ececf1;
      }
      h1 {
        font-size: 20px;
      }
      label {
        display: block;
        margin: 16px 0 4px;
        font-size: 14px;
        font-weight: 600;
      }
      .hint {
        font-size: 12px;
        color: #b4b4bc;
        margin: 2px 0 0;
      }
      input[type="text"],
      input[type="number"],
      textarea {
        width: 100%;
        box-sizing: border-box;
        background: #343541;
        color: #ececf1;
        border: 1px solid #565869;
        border-radius: 8px;
        padding: 8px;
        font-size: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        margin-top: 24px;
        background: #10a37f;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        margin-left: 12px;
        font-size: 13px;
        color: #34d399;
      }
    </style>
  </head>
  <body>
    <h1>Chat FreePT settings</h1>

    <label for="continueMessage">Auto-continue message</label>
    <textarea id="continueMessage" rows="2"></textarea>

    <label for="autoContinueCap">Auto-continue cap (per phase)</label>
    <input type="number" id="autoContinueCap" />
    <p class="hint">The run pauses and notifies you when the cap is reached.</p>

    <label for="sendDelaySec">Delay before each auto-continue (seconds)</label>
    <input type="number" id="sendDelaySec" />

    <label for="quietSec">Quiet time before a reply counts as finished (seconds)</label>
    <input type="number" id="quietSec" />

    <label for="templateRepo">CI pipeline template repo (owner/name)</label>
    <input type="text" id="templateRepo" />
    <p class="hint">ChatGPT vendors the CI control plane from this repo into each project.</p>

    <div class="row">
      <input type="checkbox" id="notificationsEnabled" />
      <label for="notificationsEnabled" style="margin: 0">Desktop notifications</label>
    </div>

    <button id="save">Save</button><span id="status"></span>

    <script src="options.js"></script>
  </body>
</html>
